<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundiveo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="#">Mundiveo</a>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Page 1</a>
                <a href="#">Page 2</a>
                <a href="#">Contact</a>
            </div>
        </nav>
    </header>

    <!-- The page layout places subscribers beside the main content. -->
    <div class="layout">
        <aside class="sidebar" aria-labelledby="subscribers-heading">
            <h2 id="subscribers-heading">Subscribers</h2>
            <div class="subscribers" aria-label="Subscribers">
                <span class="subscriber" title="Subscriber 1">S1</span>
                <span class="subscriber" title="Subscriber 2">S2</span>
                <span class="subscriber" title="Subscriber 3">S3</span>
                <span class="subscriber" title="Subscriber 4">S4</span>
            </div>
        </aside>

        <main class="content">
            <h1>Welcome</h1>
            <p>Your page content goes here.</p>
        </main>
    </div>
</body>
</html>
